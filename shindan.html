<style>
:root{--bg:#ffffff;--panel:#f4f8fb;--ink:#0f2233;--dim:#6b7a88;--key:#2f9be0;--ok:#1c8b4d;
  --hair:rgba(15,34,51,.14);--hair2:rgba(15,34,51,.08);--ghost:rgba(15,34,51,.04);
  --sans:"Noto Sans JP",sans-serif;--num:"Outfit","Noto Sans JP",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);line-height:1.85;letter-spacing:.03em;-webkit-font-smoothing:antialiased;font-weight:400}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 64px;min-height:100vh;display:flex;flex-direction:column}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;letter-spacing:.08em;color:var(--key)}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--key)}
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;padding:16px 0}
/* 進捗 */
.prog{height:6px;background:var(--ghost);border-radius:6px;overflow:hidden;margin:16px 0 6px}
.prog b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--key),#67c0f2);border-radius:6px;transition:width .4s}
.pnum{font-size:11.5px;color:var(--dim);letter-spacing:.05em;font-family:var(--num);font-weight:600}
/* カード */
.card{background:var(--bg);border:1px solid var(--hair2);border-radius:16px;padding:26px 22px;box-shadow:0 14px 40px rgba(15,34,51,.07);animation:rise .4s ease}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* スタート */
.eyeb{font-size:11.5px;letter-spacing:.22em;color:var(--key);font-weight:700;margin-bottom:14px}
h1{font-weight:700;font-size:clamp(22px,6vw,29px);line-height:1.55;letter-spacing:.02em}
h1 .u{background:linear-gradient(transparent 60%,rgba(47,155,224,.2) 0);padding:0 2px}
.lead{color:var(--dim);font-size:14px;margin-top:16px;line-height:1.9}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.meta span{font-size:11.5px;color:var(--dim);background:var(--panel);border:1px solid var(--hair2);border-radius:20px;padding:6px 12px}
/* ボタン */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:.04em;color:#fff;background:var(--key);border:none;border-radius:11px;padding:16px;margin-top:22px;cursor:pointer;transition:.2s;box-shadow:0 10px 24px rgba(47,155,224,.28)}
.btn:hover{background:#1f83c9;transform:translateY(-2px)}
.btn.ghost{background:none;color:var(--dim);box-shadow:none;border:1px solid var(--hair);font-size:13px;padding:13px;margin-top:11px;font-weight:500}
/* 質問 */
.q{font-weight:700;font-size:clamp(18px,4.8vw,22px);line-height:1.6;margin-bottom:20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--panel);border:1px solid var(--hair2);border-radius:11px;padding:15px 16px;cursor:pointer;transition:.16s}
.opt:hover,.opt:focus{border-color:var(--key);background:#eaf6fd;outline:none}
.opt .mk{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--key);color:var(--key);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;font-family:var(--num)}
.back{margin-top:16px;font-size:12.5px;color:var(--dim);background:none;border:none;cursor:pointer;font-family:inherit}
/* 診断中 */
.load{text-align:center;padding:18px 0}
.ring{width:60px;height:60px;margin:0 auto 18px;border:4px solid rgba(47,155,224,.18);border-top-color:var(--key);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* 結果 */
.score-wrap{text-align:center;margin:2px 0 16px}
.score-lbl{font-size:11.5px;letter-spacing:.18em;color:var(--key);font-weight:700}
.score{font-family:var(--num);font-weight:700;font-size:62px;line-height:1.1;color:var(--ink)}
.score small{font-size:24px;color:var(--dim)}
.tier{display:inline-block;font-weight:700;font-size:15px;padding:6px 16px;border-radius:24px;background:var(--key);color:#fff;margin-top:4px}
.rbar{height:9px;background:var(--ghost);border-radius:6px;overflow:hidden;margin:16px 0 22px}
.rbar b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--key),#67c0f2);border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.rhead{font-weight:700;font-size:14px;color:var(--ink);margin:22px 0 10px;padding-left:11px;border-left:3px solid var(--key);letter-spacing:.03em}
.analy{list-style:none;display:flex;flex-direction:column;gap:11px}
.analy li{display:flex;gap:10px;font-size:14px;line-height:1.75}
.analy .ic{flex:none;color:var(--key);font-weight:700}
/* 実績（HP画像そのまま） */
.cases{display:flex;flex-direction:column;gap:14px}
.casei{margin:0;background:var(--panel);border:1px solid var(--hair2);border-radius:12px;overflow:hidden;box-shadow:0 6px 18px rgba(15,34,51,.06)}
.casei img{width:100%;height:auto;max-height:340px;object-fit:cover;object-position:center top;display:block}
.casei figcaption{font-size:12.5px;font-weight:700;color:var(--ink);line-height:1.55;padding:11px 13px}
.srclink{display:inline-block;font-size:12.5px;color:var(--key);font-weight:700;margin-top:12px;text-decoration:underline}
/* bookrun 埋め込み */
.bookwrap{margin-top:14px;border:1px solid var(--hair2);border-radius:12px;overflow:hidden;background:#fff}
.bookrun{width:100%;height:720px;border:0;display:block}
/* CTA */
.cta-box{margin-top:24px;background:var(--panel);border:1px solid rgba(47,155,224,.28);border-radius:15px;padding:20px}
.cta-box .t{font-size:16px;font-weight:700}
.cta-box .t b{color:var(--key)}
.cta-box p{font-size:13.5px;color:var(--dim);margin-top:8px}
.cta-box .small{font-size:11.5px;color:var(--dim);margin-top:10px;text-align:center}
.disc{font-size:11px;color:var(--dim);margin-top:22px;text-align:center;line-height:1.7}
.hide{display:none!important}
a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="dot"></span>エシカル・スカイジャパン｜SNS集客 相性診断</div>

  <div id="progwrap" class="hide">
    <div class="prog"><b id="progbar"></b></div>
    <div class="pnum" id="pnum"></div>
  </div>

  <div class="stage" id="stage"></div>
</div>

<script>
/* ★ここを差し替えてください ───────────────────────────────
   BOOKRUN_URL : お客様が予約する bookrun の公開URL。
   「無料相談を予約する」ボタンを押すと、このURL（bookrun）へ直接ジャンプします。
   未設定の間は、暫定でLPの資料請求フォームへ飛びます。 */
const BOOKRUN_URL = "https://b-book.run/@sora.ogihara612-a20bc848b5548677_367bc0_0555a2_0eb35d_94a525_ef3f98_74206b";
const LP_URL      = "https://hito-hue.github.io/ethical/";
const EXPERIENCE  = "https://ethicalskyjapan.com/experience";
const BOOK_LINK   = BOOKRUN_URL || (LP_URL + "#cta");
/* ───────────────────────────────────────────────────── */

const QUESTIONS=[
  {q:"あなたの事業に近いのは？",key:"genre",opts:[
    {t:"美容・サロン・エステ",p:3},{t:"士業・コンサル・コーチ",p:3},
    {t:"店舗・飲食・教室",p:2},{t:"EC・物販・メーカー",p:2},
    {t:"医療・健康・その他",p:2}]},
  {q:"いまのSNS発信は？",key:"sns",opts:[
    {t:"まだやっていない",p:2},{t:"始めたが、伸びていない",p:3},
    {t:"そこそこ伸びてきた",p:2},{t:"すでに集客できている",p:1}]},
  {q:"主力商品・サービスの単価帯は？",key:"price",opts:[
    {t:"〜1万円",p:1},{t:"1〜10万円",p:2},
    {t:"10〜50万円",p:3},{t:"50万円以上",p:3}]},
  {q:"SNSで一番かなえたいことは？",key:"goal",opts:[
    {t:"集客・売上アップ",p:3},{t:"採用・人材集め",p:3},
    {t:"認知・ブランディング",p:2},{t:"既存客のファン化",p:2}]},
  {q:"いま一番の“つまずき”は？",key:"pain",opts:[
    {t:"何を発信すればいいか分からない",p:3},{t:"続けられない・時間がない",p:3},
    {t:"撮影・編集が難しい",p:3},{t:"投稿しても反応が取れない",p:2}]},
  {q:"動画をつくる体制は？",key:"team",opts:[
    {t:"まだ何もしていない",p:3},{t:"自分（社内）でやっている",p:2},
    {t:"一部を外注している",p:1},{t:"本格的に外注している",p:1}]}
];

/* ジャンル別の実績（根拠）：ethicalskyjapan.com/experience の画像／美容はLP実績を使用 */
const CMS="https://storage.googleapis.com/studio-cms-assets/projects/rROnPnZkaA/";
const DES="https://storage.googleapis.com/studio-design-asset-files/projects/rROnPnZkaA/";
const IMG={
  kitahara:CMS+"s-1160x724_09b2e4f5-3686-453f-a433-c48146a443c4.webp", // 北原・起業家育成
  osaru:   CMS+"s-1160x724_504c389a-9c37-4c8f-a265-24ed43c6acd3.webp", // おさる・英語コーチ
  hayashi: DES+"s-580x362_b0f421e8-5e46-48a5-b988-22d0f6fe791e.webp",  // 林・令和の虎/経営コンサル
  tsuji:   CMS+"s-1160x724_31706c03-df8a-4fed-9df0-a1894792186d.webp", // 辻・営業/FC
  aimeko:  CMS+"s-1160x724_117df88e-a961-4d3a-991d-cce591981200.webp", // あいめこ・SNS運用
  bright:  CMS+"s-1160x724_40bf6267-e7c6-4b1c-aa2d-1473f629ea46.webp", // ブライトリンク・メーカー
  friend:  CMS+"s-1160x724_45f02583-3839-44f4-a511-a797703724e0.webp", // フレンドシップ・スクール
  bishin:  "works/kim.jpg"                                             // 自然美人・小顔コルギ（LP実績）
};
const CASES={
  "美容・サロン・エステ":[
    {img:IMG.bishin,c:"自然美人 様（恵比寿 小顔コルギ専門店）｜単価40万円の回数券を10件以上販売"}],
  "士業・コンサル・コーチ":[
    {img:IMG.kitahara,c:"北原孝彦 様（起業家育成の専門家）｜1年で8万フォロワー・累計1,000万再生"},
    {img:IMG.osaru,c:"イングリッシュおさる 様（英語コーチ）｜わずかな工数で売上1,000万円規模"}],
  "店舗・飲食・教室":[
    {img:IMG.friend,c:"フレンドシップ 様（スクール運営）｜会員2,800名・集客の約7割がSNS"},
    {img:IMG.tsuji,c:"辻 敬太 様（全国・世界で500店舗のFC展開）｜累計1.5億再生"}],
  "EC・物販・メーカー":[
    {img:IMG.bright,c:"ブライトリンク 様（カプセル製造メーカー）｜製造の裏側を発信しNHKから取材"},
    {img:IMG.tsuji,c:"辻 敬太 様（物販・営業）｜累計1.5億再生"}],
  "医療・健康・その他":[
    {img:IMG.aimeko,c:"あいめこ 様（SNS運用）｜6ヶ月で627万再生"},
    {img:IMG.hayashi,c:"FCチャンネル 様（令和の虎2代目主宰）｜初動500万再生突破"}]
};

/* 計測：Metaピクセル＋Clarityへイベント送信 */
function track(name){
  try{ if(window.fbq) fbq('trackCustom', name); }catch(e){}
  try{ if(window.clarity) clarity('event', name); }catch(e){}
}

const stage=document.getElementById('stage');
const progwrap=document.getElementById('progwrap');
const progbar=document.getElementById('progbar');
const pnum=document.getElementById('pnum');
let step=-1;
const answers=[];
const esc=(s)=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function show(html){stage.innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});}

function start(){
  progwrap.classList.add('hide');
  show(`<div class="card">
      <div class="eyeb">30秒・無料・登録不要</div>
      <h1>あなたの商品・サービスは<br><span class="u">ショート動画で成果が出るか</span>？</h1>
      <p class="lead">月500本超の分析データをもとに、6つの質問であなたのSNS集客の<b>相性度</b>を無料診断。<br>最後に、あなたのジャンルの<b>実績</b>と“次の一手”をお伝えします。</p>
      <div class="meta"><span>所要 約30秒</span><span>全6問・タップだけ</span><span>その場で結果</span></div>
      <button class="btn" onclick="track('ShindanStart');next()">診断をはじめる →</button>
    </div>`);
}

function next(){
  step++;
  if(step>=QUESTIONS.length){return finish();}
  const Q=QUESTIONS[step];
  progwrap.classList.remove('hide');
  progbar.style.width=(step/QUESTIONS.length*100)+'%';
  pnum.textContent=`Q${step+1} / ${QUESTIONS.length}`;
  const opts=Q.opts.map((o,i)=>`<button class="opt" onclick="pick(${i})"><span class="mk">${'ABCDE'[i]}</span>${o.t}</button>`).join('');
  show(`<div class="card">
      <div class="q">${Q.q}</div>
      <div class="opts">${opts}</div>
      ${step>0?'<button class="back" onclick="back()">← 前の質問にもどる</button>':''}
    </div>`);
}
function pick(i){const Q=QUESTIONS[step];const o=Q.opts[i];answers[step]={p:o.p,key:Q.key,t:o.t};next();}
function back(){step-=2;if(step<-1)step=-1;next();}

function finish(){
  progbar.style.width='100%';
  progwrap.classList.add('hide');
  show(`<div class="card"><div class="load">
      <div class="ring"></div>
      <p style="font-size:17px;font-weight:700;color:var(--key)">診断中…</p>
      <p class="lead">500本超の分析データと照合しています</p>
    </div></div>`);
  setTimeout(result,1600);
}
function byKey(k){const a=answers.find(x=>x&&x.key===k);return a?a.t:'';}

function result(){
  track('ShindanComplete');
  const pts=answers.reduce((s,a)=>s+(a?a.p:0),0);
  const max=QUESTIONS.reduce((s,q)=>s+Math.max(...q.opts.map(o=>o.p)),0);
  const rel=Math.round(50+(pts/max)*46);
  let tier,tierMsg;
  if(rel>=87){tier="相性◎ 今が始めどき";tierMsg="ショート動画と非常に相性の良い事業です。仕組みさえ作れば、伸びるスピードが早いタイプ。";}
  else if(rel>=76){tier="伸びしろ大";tierMsg="設計次第で大きく伸びるポテンシャルがあります。“やり方”が整えば結果はついてきます。";}
  else{tier="戦略設計が鍵";tierMsg="今のままだと遠回りになりがち。逆に言えば、正しい設計で一気に化ける余地が大きい事業です。";}

  const A=[];
  const genre=byKey('genre'),sns=byKey('sns'),pain=byKey('pain'),price=byKey('price'),goal=byKey('goal');
  if(sns==='始めたが、伸びていない') A.push("すでに発信されているのは大きな強み。<b>“伸びない原因”は才能ではなく設計</b>で、企画と見せ方の調整で改善余地が大きいです。");
  else if(sns==='まだやっていない') A.push("未着手＝伸びしろ100%。<b>最初の設計を正しく組む</b>ほど後の伸びが変わります。今が最も差をつけやすいタイミングです。");
  else A.push("土台ができているので、<b>勝ちパターンの横展開</b>で数字を伸ばしやすい状態です。");
  if(pain) A.push(`最大の壁「<b>${esc(pain)}</b>」は、当社が最も多く解決してきた領域です。企画〜撮影〜編集〜分析まで一貫で伴走できます。`);
  if(price==='10〜50万円'||price==='50万円以上') A.push("単価が高いほど動画1本あたりの費用対効果が大きく、<b>少ない成約でも回収しやすい</b>相性の良い価格帯です。");
  if(goal==='採用・人材集め') A.push("採用は動画と好相性。<b>“働く姿・想い”が伝わる発信</b>で応募の質が変わります。");
  const bullets=A.map(t=>`<li><span class="ic">◆</span><span>${t}</span></li>`).join('');

  const list=(CASES[genre]||CASES["医療・健康・その他"]);
  const cases=list.map(c=>`<figure class="casei"><img loading="lazy" decoding="async" src="${c.img}" alt="${esc(c.c)}"><figcaption>${esc(c.c)}</figcaption></figure>`).join('');

  /* ボタンを押すと bookrun の予約ページへ直接ジャンプ（クリックを計測） */
  const booking = `<a class="btn" href="${BOOK_LINK}" target="_blank" rel="noopener" onclick="track('BookrunClick')">無料相談を予約する →</a>`;

  show(`<div class="card">
    <div class="score-wrap">
      <div class="score-lbl">あなたのSNS集客 相性度</div>
      <div class="score"><span id="scoreNum">0</span><small>%</small></div>
      <div class="tier">${tier}</div>
    </div>
    <div class="rbar"><b id="rbar"></b></div>
    <p class="lead" style="color:var(--ink)">${tierMsg}</p>

    <div class="rhead">あなた専用の診断コメント</div>
    <ul class="analy">${bullets}</ul>

    <div class="rhead">${esc(genre||'あなたのジャンル')}での実績</div>
    <div class="cases">${cases}</div>
    <a class="srclink" href="${EXPERIENCE}" target="_blank" rel="noopener">▶ 他の業種の実績もすべて見る</a>

    <div class="cta-box">
      <p class="t">次の一手は、<b>プロと30分の無料相談</b>で明確になります。</p>
      <p>あなたの事業に合わせた発信プラン・成功事例を、担当が直接ご提案します（無料・オンライン）。下の日程から選ぶだけで予約完了です。</p>
      ${booking}
      <div class="small">※しつこい営業は一切いたしません</div>
    </div>

    <a class="btn ghost" href="${LP_URL}" target="_blank" rel="noopener">サービス内容・実績を見る</a>
    <p class="disc">診断結果は回答をもとにした簡易的な目安です。<br>エシカル・スカイジャパン株式会社</p>
  </div>`);

  const el=document.getElementById('scoreNum');let n=0;
  const tm=setInterval(()=>{n+=Math.max(1,Math.round(rel/26));if(n>=rel){n=rel;clearInterval(tm);}el.textContent=n;},34);
  setTimeout(()=>{document.getElementById('rbar').style.width=rel+'%';},120);
}

start();
</script>
